name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version code (optional, will auto-increment if not provided)'
        required: false
        type: string
      versionName:
        description: 'Version name (optional)'
        required: false
        type: string
      releaseNotes:
        description: 'Release notes for this version'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: r27c
          build-tools-version: "36.0.0"

      - name: Decode Keystore
        if: env.SIGNING_STORE_FILE != ''
        run: |
          echo "${{ secrets.SIGNING_STORE_FILE }}" | base64 -d > signing.keystore
          echo "SIGNING_STORE_FILE=signing.keystore" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Build Release Bundle
        run: ./gradlew :composeApp:bundleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ env.SIGNING_STORE_FILE }}

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: composeApp/build/outputs/bundle/release/composeApp-release.aab
          retention-days: 30

  deploy-production:
    name: Deploy to Production
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Release AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: build/

      - name: Deploy to Play Store Production
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: net.kigawa.kalender
          releaseFiles: build/composeApp-release.aab
          track: production
          status: completed
          inAppUpdatePriority: 5
          releaseName: ${{ github.event.inputs.versionName || 'Release ' + github.run_number }}
          releaseNotes: ${{ github.event.inputs.releaseNotes || 'Automated release from GitHub Actions' }}
          userFraction: 0.1