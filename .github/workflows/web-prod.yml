name: Deploy Web to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (optional)'
        required: false
        type: string
      releaseNotes:
        description: 'Release notes for this version'
        required: false
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wasmJs production bundle
        run: ./gradlew :app:wasmJsBrowserProductionWebpack --no-daemon --stacktrace

      - name: Assemble web-dist
        run: |
          set -euo pipefail
          WEBPACK_OUT=app/build/kotlin-webpack/wasmJs/productionExecutable
          rm -rf web-dist
          mkdir -p web-dist

          # Webpackバンドル(JS/wasm)をコピー
          cp -r "${WEBPACK_OUT}/." web-dist/

          # Compose MultiplatformのエントリHTMLを配置
          cp app/src/wasmJsMain/resources/index.html web-dist/index.html

          # PWAマニフェストとアイコン
          cat > web-dist/manifest.json << 'EOF'
          {
            "name": "Kalender",
            "short_name": "Kalender",
            "description": "カレンダーアプリ",
            "start_url": "/",
            "display": "standalone",
            "background_color": "#fef7ff",
            "theme_color": "#6750a4",
            "icons": [
              { "src": "icon-192.png", "sizes": "192x192", "type": "image/png" },
              { "src": "icon-512.png", "sizes": "512x512", "type": "image/png" }
            ]
          }
          EOF

          # Cloudflare PagesのSPAフォールバック
          cat > web-dist/_redirects << 'EOF'
          /*    /index.html   200
          EOF

          echo "=== web-dist contents ==="
          ls -la web-dist/

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist/
          retention-days: 30

  deploy-production:
    name: Deploy to Production
    needs: build-web
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist/

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare Pages (Production)
        run: |
          npx wrangler pages deploy web-dist/ \
            --project-name=kalender \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
