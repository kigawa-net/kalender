name: Deploy Web (WasmJS) to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-web:
    name: Build Web (WasmJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build WasmJS
        run: ./gradlew :composeApp:wasmJsBrowserProductionWebpack
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          MSAL_CLIENT_ID: ${{ secrets.MSAL_CLIENT_ID }}

      - name: Upload WasmJS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasmjs-dist
          path: composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 7

  deploy-web:
    name: Deploy to Cloudflare Pages
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Download WasmJS artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasmjs-dist
          path: wasmjs-dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: kalender
          directory: wasmjs-dist/
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main