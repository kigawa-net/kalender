name: Build and Push Server to Harbor

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'k8s/overlays/production/kustomization.yaml'

permissions:
  contents: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build server distribution
        run: ./gradlew :server:installDist --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read Harbor credentials from OpenBao
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.OPENBAO_ADDR }}
          method: jwt
          path: jwt
          role: kalender-github-actions
          secrets: secret/data/kalender/ci harbor_password | HARBOR_PASS

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.kigawa.net
          username: robot$kigawa-net
          password: ${{ secrets.HARBOR_PASS }}

      - name: Build and push kalender-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            harbor.kigawa.net/library/kalender-api:latest
            harbor.kigawa.net/library/kalender-api:main-${{ github.sha }}
          cache-from: type=registry,ref=harbor.kigawa.net/library/kalender-api:buildcache
          cache-to: type=registry,ref=harbor.kigawa.net/library/kalender-api:buildcache,mode=max

      - name: Update manifest image tag
        run: |
          cd k8s/overlays/production
          sed -i 's|newTag:.*|newTag: main-${{ github.sha }}|' kustomization.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "chore: kalender-apiのイメージタグをmain-${{ github.sha }}に更新する" || exit 0
          git push

  deploy-to-k8s:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Kubernetes credentials from OpenBao
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.OPENBAO_ADDR }}
          method: jwt
          path: jwt
          role: kalender-github-actions
          secrets: secret/data/kalender/ci kube_config | KUBE_CONFIG

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ env.KUBE_CONFIG }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k k8s/overlays/production
          kubectl rollout restart deployment/kalender-api -n kigawa-net-kalender
