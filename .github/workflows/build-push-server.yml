name: Build and Push Server to Harbor

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'k8s/overlays/production/kustomization.yaml'

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build server distribution
        run: ./gradlew :server:installDist --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.kigawa.net
          username: robot$kigawa-net
          password: ${{ secrets.HARBOR_PASS }}

      - name: Build and push kalender-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            harbor.kigawa.net/library/kalender-api:latest
            harbor.kigawa.net/library/kalender-api:main-${{ github.sha }}
          cache-from: type=registry,ref=harbor.kigawa.net/library/kalender-api:buildcache
          cache-to: type=registry,ref=harbor.kigawa.net/library/kalender-api:buildcache,mode=max

      - name: Update manifest image tag
        run: |
          cd k8s/overlays/production
          sed -i 's|newTag:.*|newTag: main-${{ github.sha }}|' kustomization.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "chore: kalender-apiのイメージタグをmain-${{ github.sha }}に更新する" || exit 0
          git push
