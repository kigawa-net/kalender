apiVersion: apps/v1
kind: Deployment
metadata:
  name: kalender-api
  labels:
    app: kalender-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kalender-api
  template:
    metadata:
      labels:
        app: kalender-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "kalender-api"
        vault.hashicorp.com/agent-configmap: "kalender-openbao-agent"
        vault.hashicorp.com/agent-inject-containers: "kalender-api"
        vault.hashicorp.com/agent-inject-secret-kalender.env: "secret/data/kalender/oauth2"
        vault.hashicorp.com/agent-inject-template-kalender.env: |
          {{- with secret "secret/data/kalender/oauth2" -}}
          export KEYCLOAK_ORG_SERVICE_CLIENT_SECRET={{ .Data.data.keycloak_org_service_client_secret | toJSON }}
          export GOOGLE_CLIENT_ID={{ .Data.data.google_client_id | toJSON }}
          export GOOGLE_CLIENT_SECRET={{ .Data.data.google_client_secret | toJSON }}
          export MICROSOFT_CLIENT_ID={{ .Data.data.microsoft_client_id | toJSON }}
          export MICROSOFT_CLIENT_SECRET={{ .Data.data.microsoft_client_secret | toJSON }}
          {{- end }}
    spec:
      serviceAccountName: kalender-api
      containers:
        - name: kalender-api
          image: harbor.kigawa.net/library/kalender-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - . /vault/secrets/kalender.env; exec bin/server
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_BASE_URL
              value: "https://user.kigawa.net"
            - name: KEYCLOAK_REALM
              value: "kigawa-net"
            - name: KEYCLOAK_ORG_SERVICE_CLIENT_ID
              value: "kalender-org-service"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
