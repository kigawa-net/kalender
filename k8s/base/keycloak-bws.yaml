# Bitwardenに保存されたkalender-org-serviceクライアントシークレットをこのnamespaceに同期する。
# 前提: このnamespaceに認証用Secret `bitwarden-sec` (キー: token) が用意されていること
# (kigawa-net-k8s の bitwarden-sync-crn が TARGET_NAMESPACES へ配布する)。
# bwSecretId は keycloak namespace の同名 BitwardenSecret(kalender-org-service-keycloak-bws)と
# 同じBitwardenシークレットを指す。
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: kalender-org-service-keycloak-bws
spec:
  organizationId: "a2b57f3d-6e2b-4467-b499-b31e00bfd804"
  secretName: kalender-org-service-keycloak
  authToken:
    secretName: bitwarden-sec
    secretKey: token
  map:
    - bwSecretId: "d569a7e9-d5d2-4359-93a8-b4cc0081a0b6"
      secretKeyName: client-secret
